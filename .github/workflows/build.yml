name: Build Spectral Brain Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick gradle

      - name: Create placeholder icon
        run: |
          mkdir -p src-tauri/icons
          convert -size 256x256 xc:blue -type TrueColorAlpha PNG32:src-tauri/icons/icon.png

      - name: Install npm dependencies
        run: |
          npm install @tauri-apps/api@^2.0.0 --save
          npm install
          npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.2.3 --locked

      # ============================================
      # إنشاء مشروع Android يدويًا (بدون init)
      # ============================================
      - name: Create Android project manually
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/java/com/spectral/brain
          mkdir -p src-tauri/gen/android/app/src/main/res/values

          # build.gradle.kts
          cat > src-tauri/gen/android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              kotlin("android")
          }

          android {
              namespace = "com.spectral.brain"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.spectral.brain"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
              }
              buildTypes {
                  getByName("debug") {
                      isDebuggable = true
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOF

          # settings.gradle.kts
          cat > src-tauri/gen/android/settings.gradle.kts << 'EOF'
          rootProject.name = "spectral-brain"
          include(":app")
          EOF

          # AndroidManifest.xml
          cat > src-tauri/gen/android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Spectral Brain"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name="com.spectral.brain.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' > src-tauri/gen/android/gradle.properties

      - name: Build APK
        run: cargo tauri android build --apk --ci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectral-Brain-APK-${{ github.run_number }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
