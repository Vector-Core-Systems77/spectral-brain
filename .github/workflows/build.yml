name: Build Spectral Brain Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick

      # توليد أيقونات وهمية بسرعة لتجاوز شرط Tauri الصارم في أندرويد
      - name: Create placeholder icons
        run: |
          mkdir -p src-tauri/icons
          convert -size 1024x1024 xc:darkblue src-tauri/icons/icon.png
          convert -size 32x32 xc:darkblue src-tauri/icons/32x32.png
          convert -size 128x128 xc:darkblue src-tauri/icons/128x128.png
          convert -size 256x256 xc:darkblue src-tauri/icons/128x128@2x.png

      # تثبيت Tauri CLI بالإصدار المطابق تمامًا لـ Cargo.toml (2.0.0)
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "=2.0.0" --locked

      # تهيئة مشروع أندرويد (بدون أعلام وهمية)
      - name: Initialize Android project
        working-directory: src-tauri
        run: cargo tauri android init

      # بناء الـ APK
      - name: Build APK
        run: cargo tauri android build --apk

      # توقيع الـ APK بمسار ديناميكي لـ apksigner
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
          
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned APK not found!"
            exit 1
          fi
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -n 1)
          ${BUILD_TOOLS_DIR}apksigner sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out app-release-signed.apk "$UNSIGNED_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectral-Brain-APK
          path: app-release-signed.apk
          retention-days: 7
          if-no-files-found: error
