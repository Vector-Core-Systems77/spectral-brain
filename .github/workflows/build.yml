name: Build Spectral Brain Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          ndk-version: 25.2.9519653

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies and build frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.2.3 --locked

      - name: Remove old Android project
        run: rm -rf src-tauri/gen/android

      - name: Initialize Android project (TAURI)
        working-directory: src-tauri
        run: cargo tauri android init --ci

      - name: Build APK
        run: cargo tauri android build --apk --ci

      - name: Find and Sign APK
        run: |
          # البحث عن الملف غير الموقع
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" ! -name "*signed*" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          
          # إنشاء مفتاح توقيع مؤقت
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
          
          # البحث عن أداة التوقيع
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | head -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          # توقيع الملف
          $APKSIGNER sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out app-release-signed.apk "$UNSIGNED_APK"
          
          echo "Signed APK created: app-release-signed.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Spectral-Brain-APK-${{ github.run_number }}
          path: app-release-signed.apk
          retention-days: 30
          if-no-files-found: error
