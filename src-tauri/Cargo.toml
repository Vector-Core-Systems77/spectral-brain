[package]
name = "spectral-brain"
version = "1.0.0"
edition = "2021"

[lib]
name = "spectral_brain"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.2.0", features = ["mobile"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.2.0" }
